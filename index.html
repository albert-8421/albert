<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="https://albert.earth/">

    <meta property="og:title" content="Albert Joseph | Developer Portfolio">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Base Styles & Fonts */
        .font-serif-classic {
            font-family: 'Merriweather', serif;
        }

        /* 2. Animated Cosmic Background */
        #cosmic-background {
            background: #000;
            overflow: hidden;
            position: fixed;
            inset: 0;
            z-index: -1; /* Moved below everything safely */
        }

        /* Star layer */
        #cosmic-background::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1.5px 1.5px at 10% 10%, #eee, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 50% 80%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 40%, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 20% 60%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90% 20%, #eee, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 30% 90%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 70% 30%, #ddd, rgba(0,0,0,0));
            
            background-size: 800px 400px; 
            animation: stars-move 180s linear infinite;
        }

        /* Nebula Overlay */
        #cosmic-background::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(50, 0, 100, 0.25), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 50, 100, 0.25), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(100, 0, 0, 0.1), transparent 50%);
            opacity: 1; 
            animation: nebula-drift 60s ease-in-out infinite alternate;
        }

        @keyframes stars-move {
            from { background-position: 0 0; }
            to { background-position: 800px 400px; } /* Fixed calculation bug here */
        }

        @keyframes nebula-drift {
            0% { transform: scale(1.0) translate(0, 0); }
            100% { transform: scale(1.1) translate(10px, -10px); }
        }

        /* 3. Element Entrance & Link Styles */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-name-in {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }

        .animate-fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
        }

        /* Cosmic Link Button Style */
        .cosmic-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            border: 1px solid #06b6d4; 
            background-color: rgba(6, 182, 212, 0.1); 
            text-decoration: none;
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
            border-radius: 8px; 
            letter-spacing: 0.05em;
            text-transform: capitalize;
        }

        .cosmic-link:hover {
            background-color: #06b6d4; 
            box-shadow: 0 0 10px #06b6d4, 0 0 20px #0e7490; 
            transform: translateY(-2px) scale(1.02); 
        }

        /* Social Icon Link Styles */
        .social-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #06b6d4;
            text-decoration: none;
            transition: all 0.3s ease-in-out;
        }

        .social-icon-link svg {
            width: 2.5rem;
            height: 2.5rem;
            transition: all 0.3s ease-in-out;
        }

        .social-icon-link:hover svg {
            filter: drop-shadow(0 0 8px #06b6d4);
            transform: scale(1.15);
            color: #fff;
        }

        @media (min-width: 768px) {
            .social-icon-link svg {
                width: 3rem;
                height: 3rem;
            }
        }

        /* 5. Intro Animation */
        .intro-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            animation: smoothOverlayFade 1.5s ease-in-out forwards;
        }

        @keyframes smoothOverlayFade {
            0% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        main.intro-hidden {
            opacity: 0;
        }

        main.intro-visible {
            animation: smoothContentFade 1.5s ease-out forwards;
            animation-delay: 0.2s;
        }

        @keyframes smoothContentFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 4. Cursor Sparkle Effect Styles */
        .sparkle {
            position: fixed;
            width: var(--random-size);
            height: var(--random-size);
            background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, 0) 70%); 
            pointer-events: none; 
            border-radius: 50%;
            opacity: 0.8;
            animation: fadeOut var(--random-duration) ease-out forwards; 
            transform: translate(-50%, -50%); 
            z-index: 100; 
        }

        @keyframes fadeOut {
            0% { 
                transform: translate(-50%, -50%) scale(1); 
                opacity: 0.8; 
            }
            100% { 
                transform: translate(-50%, -50%) scale(0.1); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body class="bg-black text-gray-100 font-serif-classic overflow-x-hidden">

                <a href="https://instagram.com/i.alberrt" target="_blank" class="social-icon-link" title="Instagram">

            </div>

            <a href="mailto:albertjoseph8421@gmail.com" class="cosmic-link animate-fade-in-up"

        </section>

        <footer class="mt-16 sm:mt-24 text-xs text-gray-500 animate-fade-in-up"

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // === SMOOTH INTRO ANIMATION ===
            const introOverlay = document.getElementById('intro-overlay');
            const mainContent = document.getElementById('main-content');
            
            setTimeout(() => {
                mainContent.classList.remove('intro-hidden');
                mainContent.classList.add('intro-visible');
            }, 200);

            setTimeout(() => {
                if(introOverlay) introOverlay.remove();
            }, 1600);
            
            // Elements for Parallax
            const mainHeader = document.querySelector('header');
            const background = document.getElementById('cosmic-background');
            
            // --- 1. Subtle Parallax Effect on Scroll ---
            function handleScroll() {
                const scrollPosition = window.scrollY;
                background.style.transform = `translateY(${scrollPosition * 0.2}px)`;
                mainHeader.style.transform = `translateY(${scrollPosition * 0.1}px)`;
            }
            
            window.addEventListener('scroll', handleScroll);

            // --- 2. Cursor-Following Sparkle Effect ---
            const body = document.body;
            
            body.addEventListener('mousemove', (e) => {
                // 15% chance per mouse move event to prevent performance lag
                if (Math.random() < 0.15) { 
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    
                    sparkle.style.left = `${e.clientX}px`;
                    sparkle.style.top = `${e.clientY}px`;
                    
                    // Assign random properties via CSS variables
                    sparkle.style.setProperty('--random-size', `${Math.random() * 4 + 3}px`);
                    sparkle.style.setProperty('--random-duration', `${Math.random() * 0.6 + 0.6}s`);
                    
                    body.appendChild(sparkle);

                    sparkle.onanimationend = () => {
                        sparkle.remove();
                    };
                }
            });
        });
    </script>
</body>
