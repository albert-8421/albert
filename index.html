    <style>
        /* ------------------------------------------- */
        /* 1. Base Styles & Fonts */
        /* ------------------------------------------- */
        /* Changed font family to Merriweather (classic serif) */
        .font-serif-classic {
            font-family: 'Merriweather', serif;
        }

        /* ------------------------------------------- */
        /* 2. Animated Cosmic Background */
        /* ------------------------------------------- */
        #cosmic-background {
            background: transparent;
            overflow: hidden;
            position: relative;
        }

        /* Star layer */
        #cosmic-background::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1.5px 1.5px at 10% 10%, #eee, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 50% 80%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 40%, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 20% 60%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90% 20%, #eee, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 30% 90%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 70% 30%, #ddd, rgba(0,0,0,0));
            
            background-size: 800px 400px; 
            animation: stars-move 180s linear infinite;
            z-index: 1;
        }

        /* Nebula Overlay */
        #cosmic-background::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(50, 0, 100, 0.25), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 50, 100, 0.25), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(100, 0, 0, 0.1), transparent 50%);
            opacity: 1; 
            animation: nebula-drift 60s ease-in-out infinite alternate;
            z-index: 2;
        }

        @keyframes stars-move {
            from { background-position: 0 0; }
            to { background-position: 5000% 3000%; }
        }

        @keyframes nebula-drift {
            0% { transform: scale(1.0) translate(0, 0); }
            100% { transform: scale(1.1) translate(10px, -10px); }
        }


        /* ------------------------------------------- */
        /* 3. Element Entrance & Link Styles */
        /* ------------------------------------------- */

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Specific Fade-in for the Name (Very quick) */
        .animate-name-in {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }

        /* Standard Fade-in for other elements (Delayed) */
        .animate-fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
        }

        /* Cosmic Link Button Style (Clean/Casual) */
        .cosmic-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            border: 1px solid #06b6d4; /* Cyan */
            background-color: rgba(6, 182, 212, 0.1); 
            text-decoration: none;
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
            border-radius: 8px; /* Rounded corners */
            letter-spacing: 0.05em;
            text-transform: capitalize;
        }

        .cosmic-link:hover {
            background-color: #06b6d4; 
            box-shadow: 0 0 10px #06b6d4, 0 0 20px #0e7490; 
            transform: translateY(-2px) scale(1.02); 
        }

        /* Glowing Border Animation (on hover) */
        .cosmic-link::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .cosmic-link:hover::before {
            opacity: 1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Social Icon Link Styles */
        .social-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #06b6d4;
            text-decoration: none;
            transition: all 0.3s ease-in-out;
            position: relative;
        }

        .social-icon-link svg {
            width: 2.5rem;
            height: 2.5rem;
            transition: all 0.3s ease-in-out;
        }

        .social-icon-link:hover svg {
            filter: drop-shadow(0 0 8px #06b6d4);
            transform: scale(1.15);
        }

        @media (min-width: 768px) {
            .social-icon-link svg {
                width: 3rem;
                height: 3rem;
            }
        }


        /* ------------------------------------------- */
        /* 5. Intro Animation - Smooth Premium */
        /* ------------------------------------------- */

        .intro-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            animation: smoothOverlayFade 2.5s ease-in-out forwards;
        }

        @keyframes smoothOverlayFade {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                pointer-events: none;
            }
        }

        /* Hide main content initially */
        main.intro-hidden {
            opacity: 0;
        }

        main.intro-visible {
            animation: smoothContentFade 2s ease-out forwards;
            animation-delay: 0.3s;
        }

        @keyframes smoothContentFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }


        /* ------------------------------------------- */
        /* 4. Cursor Sparkle Effect Styles */
        /* ------------------------------------------- */

        .sparkle {
            position: fixed;
            width: var(--random-size);
            height: var(--random-size);
            background: radial-gradient(white, rgba(255, 255, 255, 0)); 
            pointer-events: none; 
            border-radius: 50%;
            opacity: 0.8;
            animation: fadeOut var(--random-duration) ease-out forwards; 
            transform: translate(-50%, -50%); 
            z-index: 100; 
        }

        @keyframes fadeOut {
            0% { 
                transform: translate(-50%, -50%) scale(1); 
                opacity: 0.8; 
            }
            100% { 
                transform: translate(-50%, -50%) scale(0.1); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body class="bg-black text-gray-100 font-serif-classic">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // === SMOOTH INTRO ANIMATION ===
            const introOverlay = document.getElementById('intro-overlay');
            const mainContent = document.getElementById('main-content');
            
            // Show content as overlay fades
            setTimeout(() => {
                mainContent.classList.remove('intro-hidden');
                mainContent.classList.add('intro-visible');
            }, 300);

            // Remove overlay from DOM after animation
            setTimeout(() => {
                introOverlay.remove();
            }, 2600);
            
            // Elements for Parallax
            const mainHeader = document.querySelector('header');
            const background = document.getElementById('cosmic-background');
            
            // --- 1. Subtle Parallax Effect on Scroll ---
            function handleScroll() {
                const scrollPosition = window.scrollY;
                
                // Background moves at 20% speed
                background.style.transform = `translateY(${scrollPosition * 0.2}px)`;
                
                // Header moves slightly slower
                mainHeader.style.transform = `translateY(${scrollPosition * 0.1}px)`;
            }
            
            window.addEventListener('scroll', handleScroll);


            // --- 2. Cursor-Following Sparkle Effect ---
            const body = document.body;
            
            body.addEventListener('mousemove', (e) => {
                
                // Throttle the creation rate to 10% chance
                if (Math.random() < 0.1) { 
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    
                    sparkle.style.left = `${e.clientX}px`;
                    sparkle.style.top = `${e.clientY}px`;
                    
                    // Randomize size and duration
                    sparkle.style.setProperty('--random-size', `${Math.random() * 4 + 2}px`);
                    sparkle.style.setProperty('--random-duration', `${Math.random() * 1 + 1}s`);
                    
                    body.appendChild(sparkle);

                    // Clean up: Remove the sparkle element after its animation finishes
                    sparkle.onanimationend = () => {
                        sparkle.remove();
                    };
                }
            });

        });
    </script>
</body>
